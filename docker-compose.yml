services:
  order-service:
    build: ./services/order-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - PAYMENT_SERVICE_URL=http://payment-service:3002
    depends_on:
      - payment-service

  payment-service:
    build: ./services/payment-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
